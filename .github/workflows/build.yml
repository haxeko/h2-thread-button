name: Build matter-button-h2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    # Button gesture state machine and battery model: no ESP-IDF needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Button FSM host test
        run: firmware/test/host/run.sh
      - name: Battery model
        run: python3 tools/battery_model.py --breakdown

  hardware-check:
    # ERC and DRC (with schematic parity) of every board in hardware/: the committed KiCad files must stay clean
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root  # the image user cannot write the checkout
    strategy:
      fail-fast: false
      matrix:
        board: [module-cr2450, module-cr123a, module-cr123a-mini]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: ERC + DRC (${{ matrix.board }})
        shell: bash
        run: |
          # global symbol / footprint library tables, as a fresh KiCad install creates them
          mkdir -p "$HOME/.config/kicad/9.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/9.0/"
          cd hardware/${{ matrix.board }}
          python3 -c "import sys; sys.path.insert(0, '../scripts'); import gen_fab; gen_fab.check()"

  build:
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.6.1_idf_v6.0.2
    strategy:
      fail-fast: false
      matrix:
        # default: board module-cr2450, ICD SIT (every controller, Apple Home included);
        # lit: ICD LIT + DSLS (sdkconfig.defaults.lit); cr123a: board module-cr123a (sdkconfig.defaults.cr123a);
        # cr123a_mini: board module-cr123a-mini (CR123A, LED GPIO11, battery sense GPIO4)
        variant: [default, lit, cr123a, cr123a_mini]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request, build the PR head commit rather than the synthetic merge commit.
          # Empty on push/dispatch: default ref.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build (esp32h2, ${{ matrix.variant }})
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          pushd $IDF_PATH && . ./export.sh && popd
          pushd $ESP_MATTER_PATH && . ./export.sh && popd
          if [ "${{ matrix.variant }}" = default ]; then
            idf.py set-target esp32h2
            idf.py build
            echo "SUFFIX=" >> "$GITHUB_ENV"
          else
            idf.py -D IDF_TARGET=esp32h2 -D SDKCONFIG=sdkconfig.${{ matrix.variant }} \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.${{ matrix.variant }}" build
            echo "SUFFIX=-${{ matrix.variant }}" >> "$GITHUB_ENV"
          fi
          # Firmware version (also the name of the complete flash image the build creates)
          echo "FW_VERSION=$(python3 -c "import json; print(json.load(open('build/project_description.json'))['project_version'])")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: matter_button_h2-${{ env.FW_VERSION }}${{ env.SUFFIX }}
          if-no-files-found: error
          path: |
            firmware/build/matter_button_h2-${{ env.FW_VERSION }}.bin
            firmware/build/matter_button_h2-ota.bin
            firmware/build/matter_button_h2.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flash_args
      # ELF/map decode silent-assert and panic addresses from a CI-flashed device
      - uses: actions/upload-artifact@v4
        with:
          name: matter_button_h2-${{ env.FW_VERSION }}${{ env.SUFFIX }}-debug
          path: |
            firmware/build/matter_button_h2.elf
            firmware/build/matter_button_h2.map
